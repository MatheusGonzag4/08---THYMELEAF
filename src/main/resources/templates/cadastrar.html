<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <title>Cadastrar Produto</title>
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Cadastrar Produto</h1>

    <form th:action="@{/cadastrar}" th:object="${produto}" method="post">
        <div class="form-group">
            <label for="nome">Nome</label>
            <input class="form-control" type="text" th:field="*{nome}"
                   placeholder="Ex: Camiseta, Notebook..." required>
        </div>

        <div class="form-group">
            <label for="preco">Preço (R$)</label>
            <input class="form-control" type="number" th:field="*{preco}"
                   step="0.01" min="0" placeholder="Ex: 49.90" required>
        </div>

        <div class="form-group">
            <label for="categoria">Categoria</label>
            <input class="form-control" type="text" th:field="*{categoria}"
                   placeholder="Ex: Eletrônico, Vestuário..." required>
        </div>

        <button class="btn btn-primary" type="submit">Cadastrar</button>
    </form>

    <a th:href="@{/lista}" class="btn btn-secondary mt-3">Ver lista de produtos</a>
</div>
</body>
</html>
